# The API listens on PORT if it is set, otherwise 8080.
server.port=${PORT:8080}

# An in-memory H2 database. Nothing is installed and nothing is persisted:
# every start loads data/seed.sql fresh. See com.cu.api.config.DatabaseConfig.
spring.datasource.url=jdbc:h2:mem:accounts;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Seeding is done explicitly from data/seed.sql, not from a classpath data.sql.
spring.sql.init.mode=never

spring.main.banner-mode=off
